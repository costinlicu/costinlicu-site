<!DOCTYPE html>
<html lang="ro">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rețete | Recipe Lab</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-top: 35px;
            margin-bottom: 25px;
        }

        .button {
            border: 0;
            background: #1c1c1c;
            color: white;
            padding: 13px 20px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 15px;
        }

        .button:hover {
            background: #333;
        }

        .button-secondary {
            background: #ece7de;
            color: #222;
        }

        .button-danger {
            background: transparent;
            color: #a44040;
            padding: 8px 5px;
        }

        .button-edit {
            background: #ece7de;
            color: #222;
        }

        .form-card,
        .recipe-card {
            background: white;
            padding: 28px;
            border-radius: 14px;
            border: 1px solid #e8e3da;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d8d4cc;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        .recipe-info-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 18px;
        }

        .ingredient-builder {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 12px;
            align-items: end;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #eeeae3;
        }

        .recipe-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        .recipe-table th,
        .recipe-table td {
            padding: 14px;
            border-bottom: 1px solid #eeeae3;
            text-align: left;
        }

        .recipe-table th {
            color: #777;
            font-size: 13px;
        }

        .cost-summary {
            display: flex;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .cost-box {
            background: #f7f4ee;
            padding: 20px 25px;
            border-radius: 12px;
            min-width: 270px;
        }

        .cost-line {
            display: flex;
            justify-content: space-between;
            gap: 30px;
            margin-bottom: 10px;
        }

        .cost-line:last-child {
            margin-bottom: 0;
            padding-top: 10px;
            border-top: 1px solid #ddd6ca;
            font-size: 19px;
            font-weight: bold;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .empty-state {
            background: white;
            padding: 45px;
            text-align: center;
            border: 1px solid #e8e3da;
            border-radius: 14px;
            color: #777;
        }

        .recipe-header {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: flex-start;
        }

        .recipe-header h3 {
            margin: 0 0 6px 0;
            font-size: 21px;
        }

        .recipe-meta {
            color: #777;
            font-size: 14px;
        }

        .recipe-total {
            font-size: 22px;
            font-weight: bold;
        }

        .saved-recipe-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .saved-recipe-table td {
            border-bottom: 1px solid #eeeae3;
            padding: 11px 5px;
        }

        .saved-recipe-table td:last-child {
            text-align: right;
        }

        .recipe-actions {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
        }

        .edit-notice {
            background: #f7f4ee;
            border-radius: 9px;
            padding: 12px 15px;
            margin-bottom: 22px;
            font-size: 14px;
            color: #555;
        }

        @media (max-width: 800px) {

            .recipe-info-grid,
            .ingredient-builder {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .recipe-header {
                flex-direction: column;
            }

            .cost-summary {
                justify-content: stretch;
            }

            .cost-box {
                width: 100%;
            }

            .table-wrapper {
                overflow-x: auto;
            }

            .recipe-table {
                min-width: 650px;
            }

            .recipe-actions {
                justify-content: flex-start;
                flex-wrap: wrap;
            }

        }

    </style>

</head>


<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            Recipe Lab
        </div>

        <div class="subtitle">
            by Costin Licu
        </div>

        <nav class="nav">

            <a href="index.html">
                Dashboard
            </a>

            <a href="ingrediente.html">
                Ingrediente
            </a>

            <a href="retete.html" class="active">
                Rețete
            </a>

            <a href="#">
                Calculator
            </a>

            <a href="#">
                Fișe tehnologice
            </a>

        </nav>

    </aside>


    <main class="main">

        <div class="header">

            <h1>Rețete</h1>

            <p>
                Creează, editează și calculează automat costul rețetelor.
            </p>

        </div>


        <div class="toolbar">

            <strong>
                Rețetele mele
            </strong>

            <button
                class="button"
                onclick="showNewRecipeForm()">

                + Rețetă nouă

            </button>

        </div>


        <!-- FORMULAR -->

        <div
            id="recipeForm"
            class="form-card"
            style="display:none;">

            <h2
                id="recipeFormTitle"
                style="margin-top:0;">

                Rețetă nouă

            </h2>


            <div
                id="editNotice"
                class="edit-notice"
                style="display:none;">

                Editezi o rețetă existentă.
                Modificările vor fi salvate peste versiunea actuală.

            </div>


            <div class="recipe-info-grid">

                <div>

                    <label>
                        Denumire rețetă
                    </label>

                    <input
                        type="text"
                        id="recipeName"
                        placeholder="Ex: Mousse de ciocolată">

                </div>


                <div>

                    <label>
                        Număr porții
                    </label>

                    <input
                        type="number"
                        id="recipePortions"
                        min="1"
                        step="1"
                        value="1">

                </div>

            </div>


            <!-- ADAUGARE INGREDIENT -->

            <div class="ingredient-builder">

                <div>

                    <label>
                        Ingredient
                    </label>

                    <select id="recipeIngredient">
                    </select>

                </div>


                <div>

                    <label id="quantityLabel">
                        Cantitate
                    </label>

                    <input
                        type="number"
                        id="recipeIngredientQuantity"
                        min="0"
                        step="0.01"
                        placeholder="100">

                </div>


                <div>

                    <button
                        class="button"
                        onclick="addIngredientToRecipe()">

                        + Adaugă

                    </button>

                </div>

            </div>


            <div id="currentRecipeArea">
            </div>


            <div class="form-actions">

                <button
                    id="saveRecipeButton"
                    class="button"
                    onclick="saveCurrentRecipe()">

                    Salvează rețeta

                </button>

                <button
                    class="button button-secondary"
                    onclick="cancelRecipe()">

                    Anulează

                </button>

            </div>

        </div>


        <!-- LISTA RETETE -->

        <div id="recipeList">
        </div>

    </main>

</div>


<script src="app.js?v=3"></script>


<script>

let currentRecipeLines = [];

let editingRecipeId = null;


/* =========================
   RETETA NOUA
========================= */

function showNewRecipeForm() {

    const ingredients =
        getIngredients();


    if (ingredients.length === 0) {

        alert(
            "Mai întâi trebuie să introduci cel puțin un ingredient."
        );

        return;
    }


    editingRecipeId = null;

    currentRecipeLines = [];


    document.getElementById(
        "recipeName"
    ).value = "";


    document.getElementById(
        "recipePortions"
    ).value = "1";


    document.getElementById(
        "recipeIngredientQuantity"
    ).value = "";


    document.getElementById(
        "recipeFormTitle"
    ).textContent =
        "Rețetă nouă";


    document.getElementById(
        "saveRecipeButton"
    ).textContent =
        "Salvează rețeta";


    document.getElementById(
        "editNotice"
    ).style.display =
        "none";


    populateIngredientSelect();

    renderCurrentRecipe();


    document.getElementById(
        "recipeForm"
    ).style.display =
        "block";


    document.getElementById(
        "recipeName"
    ).focus();
}


/* =========================
   EDITARE RETETA
========================= */

function editRecipe(id) {

    const recipes =
        getRecipes();


    const recipe =
        recipes.find(
            recipe =>
                Number(recipe.id) ===
                Number(id)
        );


    if (!recipe) {

        alert(
            "Rețeta nu a fost găsită."
        );

        return;
    }


    editingRecipeId =
        Number(id);


    currentRecipeLines =
        recipe.ingredients.map(
            line => ({

                ingredientId:
                    Number(
                        line.ingredientId
                    ),

                quantity:
                    Number(
                        line.quantity
                    )

            })
        );


    document.getElementById(
        "recipeName"
    ).value =
        recipe.name;


    document.getElementById(
        "recipePortions"
    ).value =
        recipe.portions;


    document.getElementById(
        "recipeIngredientQuantity"
    ).value =
        "";


    document.getElementById(
        "recipeFormTitle"
    ).textContent =
        "Editează rețeta";


    document.getElementById(
        "saveRecipeButton"
    ).textContent =
        "Salvează modificările";


    document.getElementById(
        "editNotice"
    ).style.display =
        "block";


    populateIngredientSelect();

    renderCurrentRecipe();


    document.getElementById(
        "recipeForm"
    ).style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================
   ANULARE
========================= */

function cancelRecipe() {

    editingRecipeId = null;

    currentRecipeLines = [];


    document.getElementById(
        "recipeName"
    ).value = "";


    document.getElementById(
        "recipePortions"
    ).value = "1";


    document.getElementById(
        "recipeIngredientQuantity"
    ).value = "";


    document.getElementById(
        "recipeForm"
    ).style.display =
        "none";


    document.getElementById(
        "editNotice"
    ).style.display =
        "none";


    renderCurrentRecipe();
}


/* =========================
   SELECT INGREDIENT
========================= */

function populateIngredientSelect() {

    const ingredients =
        getIngredients();


    const select =
        document.getElementById(
            "recipeIngredient"
        );


    select.innerHTML = "";


    const sortedIngredients =
        [...ingredients].sort(
            (a, b) =>
                a.name.localeCompare(
                    b.name,
                    "ro"
                )
        );


    sortedIngredients.forEach(
        ingredient => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                ingredient.id;


            option.textContent =
                ingredient.name +
                " — " +
                formatMoney(
                    ingredient.price
                );


            select.appendChild(
                option
            );

        }
    );


    updateQuantityLabel();
}


document.getElementById(
    "recipeIngredient"
).addEventListener(
    "change",
    updateQuantityLabel
);


function updateQuantityLabel() {

    const ingredientId =
        document.getElementById(
            "recipeIngredient"
        ).value;


    const ingredient =
        getIngredientById(
            ingredientId
        );


    const label =
        document.getElementById(
            "quantityLabel"
        );


    if (!ingredient) {

        label.textContent =
            "Cantitate";

        return;
    }


    label.textContent =
        "Cantitate (" +
        ingredient.unit +
        ")";
}


/* =========================
   ADAUGARE INGREDIENT
========================= */

function addIngredientToRecipe() {

    const ingredientId =
        Number(
            document.getElementById(
                "recipeIngredient"
            ).value
        );


    const quantity =
        Number(
            document.getElementById(
                "recipeIngredientQuantity"
            ).value
        );


    const ingredient =
        getIngredientById(
            ingredientId
        );


    if (!ingredient) {

        alert(
            "Selectează un ingredient."
        );

        return;
    }


    if (
        !quantity ||
        quantity <= 0
    ) {

        alert(
            "Introdu o cantitate corectă."
        );

        return;
    }


    const existingLine =
        currentRecipeLines.find(
            line =>
                Number(
                    line.ingredientId
                ) ===
                Number(
                    ingredientId
                )
        );


    if (existingLine) {

        existingLine.quantity +=
            quantity;

    } else {

        currentRecipeLines.push({

            ingredientId:
                ingredientId,

            quantity:
                quantity

        });

    }


    document.getElementById(
        "recipeIngredientQuantity"
    ).value = "";


    renderCurrentRecipe();
}


/* =========================
   STERGERE INGREDIENT DIN RETETA
========================= */

function removeRecipeLine(
    ingredientId
) {

    currentRecipeLines =
        currentRecipeLines.filter(
            line =>
                Number(
                    line.ingredientId
                ) !==
                Number(
                    ingredientId
                )
        );


    renderCurrentRecipe();
}


/* =========================
   MODIFICARE CANTITATE DIRECT
========================= */

function updateRecipeLineQuantity(
    ingredientId,
    value
) {

    const quantity =
        Number(value);


    if (
        isNaN(quantity) ||
        quantity <= 0
    ) {

        return;
    }


    const line =
        currentRecipeLines.find(
            line =>
                Number(
                    line.ingredientId
                ) ===
                Number(
                    ingredientId
                )
        );


    if (!line) {
        return;
    }


    line.quantity =
        quantity;


    renderCurrentRecipe();
}


/* =========================
   COST RETETA CURENTA
========================= */

function calculateCurrentRecipeTotal() {

    let total = 0;


    currentRecipeLines.forEach(
        line => {

            const ingredient =
                getIngredientById(
                    line.ingredientId
                );


            if (!ingredient) {
                return;
            }


            total +=
                Number(
                    ingredient.unitCost
                ) *
                Number(
                    line.quantity
                );

        }
    );


    return total;
}


/* =========================
   AFISARE RETETA CURENTA
========================= */

function renderCurrentRecipe() {

    const container =
        document.getElementById(
            "currentRecipeArea"
        );


    if (
        currentRecipeLines.length === 0
    ) {

        container.innerHTML = "";

        return;
    }


    let html = `

        <div class="table-wrapper">

        <table class="recipe-table">

            <thead>

                <tr>

                    <th>
                        Ingredient
                    </th>

                    <th>
                        Cantitate
                    </th>

                    <th>
                        Cost/unitate
                    </th>

                    <th>
                        Cost
                    </th>

                    <th></th>

                </tr>

            </thead>

            <tbody>

    `;


    currentRecipeLines.forEach(
        line => {

            const ingredient =
                getIngredientById(
                    line.ingredientId
                );


            if (!ingredient) {
                return;
            }


            const lineCost =
                Number(
                    ingredient.unitCost
                ) *
                Number(
                    line.quantity
                );


            html += `

                <tr>

                    <td>

                        <strong>

                            ${escapeHtml(
                                ingredient.name
                            )}

                        </strong>

                    </td>


                    <td>

                        <div
                            style="
                                display:flex;
                                align-items:center;
                                gap:8px;
                                max-width:160px;
                            ">

                            <input
                                type="number"
                                min="0.01"
                                step="0.01"
                                value="${line.quantity}"
                                onchange="updateRecipeLineQuantity(
                                    ${ingredient.id},
                                    this.value
                                )">

                            <span>
                                ${ingredient.unit}
                            </span>

                        </div>

                    </td>


                    <td>

                        ${formatUnitCost(
                            ingredient.unitCost
                        )}

                        / ${ingredient.unit}

                    </td>


                    <td>

                        <strong>

                            ${formatMoney(
                                lineCost
                            )}

                        </strong>

                    </td>


                    <td>

                        <button
                            class="button button-danger"
                            onclick="removeRecipeLine(
                                ${ingredient.id}
                            )">

                            Șterge

                        </button>

                    </td>

                </tr>

            `;

        }
    );


    const total =
        calculateCurrentRecipeTotal();


    const portions =
        Number(
            document.getElementById(
                "recipePortions"
            ).value
        ) || 1;


    const costPerPortion =
        total / portions;


    html += `

            </tbody>

        </table>

        </div>


        <div class="cost-summary">

            <div class="cost-box">

                <div class="cost-line">

                    <span>
                        Cost total
                    </span>

                    <strong>
                        ${formatMoney(total)}
                    </strong>

                </div>


                <div class="cost-line">

                    <span>
                        Cost / porție
                    </span>

                    <strong>
                        ${formatMoney(
                            costPerPortion
                        )}
                    </strong>

                </div>

            </div>

        </div>

    `;


    container.innerHTML =
        html;
}


document.getElementById(
    "recipePortions"
).addEventListener(
    "input",
    renderCurrentRecipe
);


/* =========================
   SALVARE
========================= */

function saveCurrentRecipe() {

    const name =
        document.getElementById(
            "recipeName"
        ).value.trim();


    const portions =
        Number(
            document.getElementById(
                "recipePortions"
            ).value
        );


    if (!name) {

        alert(
            "Introdu denumirea rețetei."
        );

        return;
    }


    if (
        !portions ||
        portions <= 0
    ) {

        alert(
            "Introdu un număr corect de porții."
        );

        return;
    }


    if (
        currentRecipeLines.length === 0
    ) {

        alert(
            "Adaugă cel puțin un ingredient."
        );

        return;
    }


    let recipes =
        getRecipes();


    /* EDITARE */

    if (
        editingRecipeId !== null
    ) {

        const index =
            recipes.findIndex(
                recipe =>
                    Number(
                        recipe.id
                    ) ===
                    Number(
                        editingRecipeId
                    )
            );


        if (index === -1) {

            alert(
                "Rețeta nu a fost găsită."
            );

            return;
        }


        const oldRecipe =
            recipes[index];


        recipes[index] = {

            ...oldRecipe,

            name:
                name,

            portions:
                portions,

            ingredients:
                currentRecipeLines.map(
                    line => ({

                        ingredientId:
                            Number(
                                line.ingredientId
                            ),

                        quantity:
                            Number(
                                line.quantity
                            )

                    })
                ),

            updatedAt:
                new Date().toISOString()

        };

    }

    /* RETETA NOUA */

    else {

        const recipe = {

            id:
                Date.now(),

            name:
                name,

            portions:
                portions,

            ingredients:
                currentRecipeLines.map(
                    line => ({

                        ingredientId:
                            Number(
                                line.ingredientId
                            ),

                        quantity:
                            Number(
                                line.quantity
                            )

                    })
                ),

            createdAt:
                new Date().toISOString()

        };


        recipes.push(
            recipe
        );

    }


    saveRecipes(
        recipes
    );


    cancelRecipe();

    renderRecipes();
}


/* =========================
   COST RETETA SALVATA
========================= */

function calculateRecipeTotal(
    recipe
) {

    let total = 0;


    recipe.ingredients.forEach(
        line => {

            const ingredient =
                getIngredientById(
                    line.ingredientId
                );


            if (!ingredient) {
                return;
            }


            total +=
                Number(
                    ingredient.unitCost
                ) *
                Number(
                    line.quantity
                );

        }
    );


    return total;
}


/* =========================
   STERGERE RETETA
========================= */

function deleteRecipe(id) {

    const confirmed =
        confirm(
            "Ștergi această rețetă?"
        );


    if (!confirmed) {
        return;
    }


    let recipes =
        getRecipes();


    recipes =
        recipes.filter(
            recipe =>
                Number(
                    recipe.id
                ) !==
                Number(id)
        );


    saveRecipes(
        recipes
    );


    renderRecipes();
}


/* =========================
   AFISARE RETETE
========================= */

function renderRecipes() {

    const recipes =
        getRecipes();


    const container =
        document.getElementById(
            "recipeList"
        );


    if (
        recipes.length === 0
    ) {

        container.innerHTML = `

            <div class="empty-state">

                Nu ai creat încă nicio rețetă.

                <br><br>

                Apasă
                <strong>+ Rețetă nouă</strong>
                pentru a începe.

            </div>

        `;

        return;
    }


    let html = "";


    recipes
        .slice()
        .reverse()
        .forEach(
            recipe => {

                const total =
                    calculateRecipeTotal(
                        recipe
                    );


                const costPerPortion =
                    total /
                    Number(
                        recipe.portions
                    );


                html += `

                    <div class="recipe-card">

                        <div class="recipe-header">

                            <div>

                                <h3>

                                    ${escapeHtml(
                                        recipe.name
                                    )}

                                </h3>

                                <div class="recipe-meta">

                                    ${recipe.portions}

                                    ${
                                        Number(
                                            recipe.portions
                                        ) === 1
                                            ? "porție"
                                            : "porții"
                                    }

                                    ·

                                    ${
                                        recipe.ingredients.length
                                    }

                                    ${
                                        recipe.ingredients.length === 1
                                            ? "ingredient"
                                            : "ingrediente"
                                    }

                                </div>

                            </div>


                            <div>

                                <div class="recipe-total">

                                    ${formatMoney(
                                        total
                                    )}

                                </div>

                                <div class="recipe-meta">

                                    ${formatMoney(
                                        costPerPortion
                                    )}

                                    / porție

                                </div>

                            </div>

                        </div>


                        <table class="saved-recipe-table">

                `;


                recipe.ingredients.forEach(
                    line => {

                        const ingredient =
                            getIngredientById(
                                line.ingredientId
                            );


                        if (!ingredient) {

                            html += `

                                <tr>

                                    <td>
                                        Ingredient indisponibil
                                    </td>

                                    <td>
                                        -
                                    </td>

                                </tr>

                            `;

                            return;
                        }


                        const cost =
                            Number(
                                ingredient.unitCost
                            ) *
                            Number(
                                line.quantity
                            );


                        html += `

                            <tr>

                                <td>

                                    ${escapeHtml(
                                        ingredient.name
                                    )}

                                    —

                                    ${formatQuantity(
                                        line.quantity
                                    )}

                                    ${ingredient.unit}

                                </td>

                                <td>

                                    ${formatMoney(
                                        cost
                                    )}

                                </td>

                            </tr>

                        `;

                    }
                );


                html += `

                        </table>


                        <div class="recipe-actions">

                            <button
                                class="button button-edit"
                                onclick="editRecipe(
                                    ${recipe.id}
                                )">

                                Editează

                            </button>


                            <button
                                class="button button-danger"
                                onclick="deleteRecipe(
                                    ${recipe.id}
                                )">

                                Șterge rețeta

                            </button>

                        </div>

                    </div>

                `;

            }
        );


    container.innerHTML =
        html;
}


renderRecipes();

</script>


</body>

</html>
