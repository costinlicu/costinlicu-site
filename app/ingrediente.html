<!DOCTYPE html>
<html lang="ro">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ingrediente | Recipe Lab</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-top: 35px;
            margin-bottom: 25px;
        }

        .button {
            border: 0;
            background: #1c1c1c;
            color: white;
            padding: 13px 20px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 15px;
        }

        .button:hover {
            background: #333;
        }

        .button-secondary {
            background: #ece7de;
            color: #222;
        }

        .form-card {
            background: white;
            padding: 28px;
            border-radius: 14px;
            border: 1px solid #e8e3da;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d8d4cc;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        .form-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .ingredient-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #e8e3da;
        }

        .ingredient-table th,
        .ingredient-table td {
            padding: 16px;
            border-bottom: 1px solid #eeeae3;
            text-align: left;
        }

        .ingredient-table th {
            font-size: 13px;
            color: #777;
            background: #fbfaf7;
        }

        .action-buttons {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .edit-button {
            border: 0;
            background: transparent;
            color: #222;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            padding: 5px 0;
        }

        .edit-button:hover {
            text-decoration: underline;
        }

        .delete-button {
            border: 0;
            background: transparent;
            color: #a44040;
            cursor: pointer;
            font-size: 14px;
            padding: 5px 0;
        }

        .delete-button:hover {
            text-decoration: underline;
        }

        .empty-state {
            background: white;
            padding: 45px;
            text-align: center;
            border: 1px solid #e8e3da;
            border-radius: 14px;
            color: #777;
        }

        .summary {
            font-size: 14px;
            color: #777;
            margin-bottom: 15px;
        }

        .edit-notice {
            background: #f7f4ee;
            border-radius: 9px;
            padding: 12px 15px;
            margin-bottom: 22px;
            font-size: 14px;
            color: #555;
        }

        @media (max-width: 800px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .toolbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .table-wrapper {
                overflow-x: auto;
            }

            .ingredient-table {
                min-width: 760px;
            }

        }

    </style>

</head>


<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            Recipe Lab
        </div>

        <div class="subtitle">
            by Costin Licu
        </div>

        <nav class="nav">

            <a href="index.html">
                Dashboard
            </a>

            <a href="ingrediente.html"
               class="active">
                Ingrediente
            </a>

            <a href="retete.html">
                Rețete
            </a>

           <a href="calculator.html">
    Calculator
</a>

            <a href="fise.html">
    Fișe tehnologice
</a>

        </nav>

    </aside>


    <main class="main">

        <div class="header">

            <h1>Ingrediente</h1>

            <p>
                Gestionează ingredientele și prețurile de achiziție.
            </p>

        </div>


        <div class="toolbar">

            <div>
                <strong>Baza de ingrediente</strong>
            </div>

            <button
                class="button"
                onclick="showNewIngredientForm()">

                + Ingredient nou

            </button>

        </div>


        <!-- FORMULAR -->

        <div
            id="ingredientForm"
            class="form-card"
            style="display:none;">

            <h2
                id="ingredientFormTitle"
                style="margin-top:0;">

                Ingredient nou

            </h2>


            <div
                id="editNotice"
                class="edit-notice"
                style="display:none;">

                Modificările de preț vor actualiza automat
                costurile rețetelor care folosesc acest ingredient.

            </div>


            <div class="form-grid">

                <div>

                    <label>
                        Denumire ingredient
                    </label>

                    <input
                        type="text"
                        id="ingredientName"
                        placeholder="Ex: Ciocolată neagră 70%">

                </div>


                <div>

                    <label>
                        Cantitate cumpărată
                    </label>

                    <input
                        type="number"
                        id="ingredientQuantity"
                        min="0"
                        step="0.01"
                        placeholder="1000">

                </div>


                <div>

                    <label>
                        Unitate
                    </label>

                    <select id="ingredientUnit">

                        <option value="g">
                            grame
                        </option>

                        <option value="ml">
                            mililitri
                        </option>

                        <option value="buc">
                            bucăți
                        </option>

                    </select>

                </div>


                <div>

                    <label>
                        Preț achiziție (lei)
                    </label>

                    <input
                        type="number"
                        id="ingredientPrice"
                        min="0"
                        step="0.01"
                        placeholder="85">

                </div>

            </div>


            <div class="form-actions">

                <button
                    id="saveIngredientButton"
                    class="button"
                    onclick="saveIngredient()">

                    Salvează ingredient

                </button>

                <button
                    class="button button-secondary"
                    onclick="cancelIngredientForm()">

                    Anulează

                </button>

            </div>

        </div>


        <div
            id="summary"
            class="summary">
        </div>


        <div id="ingredientList">
        </div>

    </main>

</div>


<script src="app.js?v=3"></script>


<script>

let editingIngredientId = null;


/* =========================
   INGREDIENT NOU
========================= */

function showNewIngredientForm() {

    editingIngredientId = null;

    clearIngredientForm();

    document.getElementById(
        "ingredientFormTitle"
    ).textContent = "Ingredient nou";

    document.getElementById(
        "saveIngredientButton"
    ).textContent = "Salvează ingredient";

    document.getElementById(
        "editNotice"
    ).style.display = "none";

    document.getElementById(
        "ingredientForm"
    ).style.display = "block";

    document.getElementById(
        "ingredientName"
    ).focus();
}


/* =========================
   EDITARE INGREDIENT
========================= */

function editIngredient(id) {

    const ingredient =
        getIngredientById(id);

    if (!ingredient) {

        alert(
            "Ingredientul nu a fost găsit."
        );

        return;
    }


    editingIngredientId =
        Number(id);


    document.getElementById(
        "ingredientName"
    ).value =
        ingredient.name;


    document.getElementById(
        "ingredientQuantity"
    ).value =
        ingredient.quantity;


    document.getElementById(
        "ingredientUnit"
    ).value =
        ingredient.unit;


    document.getElementById(
        "ingredientPrice"
    ).value =
        ingredient.price;


    document.getElementById(
        "ingredientFormTitle"
    ).textContent =
        "Editează ingredient";


    document.getElementById(
        "saveIngredientButton"
    ).textContent =
        "Salvează modificările";


    document.getElementById(
        "editNotice"
    ).style.display =
        "block";


    document.getElementById(
        "ingredientForm"
    ).style.display =
        "block";


    document.getElementById(
        "ingredientName"
    ).focus();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================
   SALVARE
========================= */

function saveIngredient() {

    const name =
        document.getElementById(
            "ingredientName"
        ).value.trim();


    const quantity =
        parseFloat(
            document.getElementById(
                "ingredientQuantity"
            ).value
        );


    const unit =
        document.getElementById(
            "ingredientUnit"
        ).value;


    const price =
        parseFloat(
            document.getElementById(
                "ingredientPrice"
            ).value
        );


    if (
        !name ||
        isNaN(quantity) ||
        quantity <= 0 ||
        isNaN(price) ||
        price < 0
    ) {

        alert(
            "Completează corect toate câmpurile."
        );

        return;
    }


    const unitCost =
        price / quantity;


    let ingredients =
        getIngredients();


    /* EDITARE */

    if (editingIngredientId !== null) {

        const index =
            ingredients.findIndex(
                ingredient =>
                    Number(
                        ingredient.id
                    ) ===
                    Number(
                        editingIngredientId
                    )
            );


        if (index === -1) {

            alert(
                "Ingredientul nu a fost găsit."
            );

            return;
        }


        const oldIngredient =
            ingredients[index];


        ingredients[index] = {

            ...oldIngredient,

            name:
                name,

            quantity:
                quantity,

            unit:
                unit,

            price:
                price,

            unitCost:
                unitCost,

            updatedAt:
                new Date().toISOString()

        };

    }

    /* INGREDIENT NOU */

    else {

        const ingredient = {

            id:
                Date.now(),

            name:
                name,

            quantity:
                quantity,

            unit:
                unit,

            price:
                price,

            unitCost:
                unitCost,

            createdAt:
                new Date().toISOString()

        };


        ingredients.push(
            ingredient
        );

    }


    saveIngredients(
        ingredients
    );


    cancelIngredientForm();

    renderIngredients();
}


/* =========================
   ANULARE
========================= */

function cancelIngredientForm() {

    editingIngredientId = null;

    clearIngredientForm();

    document.getElementById(
        "ingredientForm"
    ).style.display =
        "none";


    document.getElementById(
        "editNotice"
    ).style.display =
        "none";
}


function clearIngredientForm() {

    document.getElementById(
        "ingredientName"
    ).value = "";

    document.getElementById(
        "ingredientQuantity"
    ).value = "";

    document.getElementById(
        "ingredientPrice"
    ).value = "";

    document.getElementById(
        "ingredientUnit"
    ).value = "g";
}


/* =========================
   STERGERE
========================= */

function deleteIngredient(id) {

    const recipes =
        getRecipes();


    const isUsed =
        recipes.some(
            recipe =>
                recipe.ingredients.some(
                    line =>
                        Number(
                            line.ingredientId
                        ) ===
                        Number(id)
                )
        );


    if (isUsed) {

        alert(
            "Acest ingredient este folosit într-o rețetă și nu poate fi șters. Îl poți edita oricând."
        );

        return;
    }


    const confirmDelete =
        confirm(
            "Ștergi acest ingredient?"
        );


    if (!confirmDelete) {
        return;
    }


    let ingredients =
        getIngredients();


    ingredients =
        ingredients.filter(
            ingredient =>
                Number(
                    ingredient.id
                ) !==
                Number(id)
        );


    saveIngredients(
        ingredients
    );


    renderIngredients();
}


/* =========================
   AFISARE
========================= */

function renderIngredients() {

    const ingredients =
        getIngredients();


    const container =
        document.getElementById(
            "ingredientList"
        );


    const summary =
        document.getElementById(
            "summary"
        );


    summary.textContent =
        ingredients.length +
        (
            ingredients.length === 1
                ? " ingredient"
                : " ingrediente"
        );


    if (
        ingredients.length === 0
    ) {

        container.innerHTML = `

            <div class="empty-state">

                Nu ai introdus încă niciun ingredient.

                <br><br>

                Apasă
                <strong>+ Ingredient nou</strong>
                pentru a începe.

            </div>

        `;

        return;
    }


    const sortedIngredients =
        [...ingredients].sort(
            (a, b) =>
                a.name.localeCompare(
                    b.name,
                    "ro"
                )
        );


    let html = `

        <div class="table-wrapper">

        <table class="ingredient-table">

            <thead>

                <tr>

                    <th>
                        Ingredient
                    </th>

                    <th>
                        Cantitate achiziție
                    </th>

                    <th>
                        Preț
                    </th>

                    <th>
                        Cost / unitate
                    </th>

                    <th>
                        Acțiuni
                    </th>

                </tr>

            </thead>

            <tbody>

    `;


    sortedIngredients.forEach(
        ingredient => {


            html += `

                <tr>

                    <td>

                        <strong>

                            ${escapeHtml(
                                ingredient.name
                            )}

                        </strong>

                    </td>


                    <td>

                        ${formatQuantity(
                            ingredient.quantity
                        )}

                        ${ingredient.unit}

                    </td>


                    <td>

                        ${formatMoney(
                            ingredient.price
                        )}

                    </td>


                    <td>

                        <strong>

                            ${formatUnitCost(
                                ingredient.unitCost
                            )}

                        </strong>

                        /
                        ${ingredient.unit}

                    </td>


                    <td>

                        <div class="action-buttons">

                            <button
                                class="edit-button"
                                onclick="editIngredient(
                                    ${ingredient.id}
                                )">

                                Editează

                            </button>


                            <button
                                class="delete-button"
                                onclick="deleteIngredient(
                                    ${ingredient.id}
                                )">

                                Șterge

                            </button>

                        </div>

                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

        </div>

    `;


    container.innerHTML =
        html;
}


renderIngredients();

</script>


</body>

</html>
